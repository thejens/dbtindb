[package]
name = "sqlite_dbinja"
description = "dbinja for SQLite: a loadable extension that builds dbt-style Jinja SQL models inside the database."
edition = "2024"
version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# Loaded at run time (`.load`, `load_extension()`); SQLite derives the entry
# point sqlite3_sqlitedbinja_init from the file name libsqlite_dbinja.
crate-type = ["cdylib"]

[dependencies]
dbinja-core = { path = "../dbinja-core" }
# Talked to directly, through the routine table SQLite hands a loadable
# extension; bindgen runs against the vendored 3.37.2 headers (see
# sqlite-headers/README.md), which sets the minimum SQLite version.
libsqlite3-sys = { version = "0.39.1", default-features = false, features = ["loadable_extension", "buildtime_bindgen"] }
serde_json.workspace = true
