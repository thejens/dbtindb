[target.'cfg(target_os="macos")']
# Postgres symbols won't be available until runtime
rustflags = ["-Clink-arg=-Wl,-undefined,dynamic_lookup"]

# Point libsqlite3-sys at the vendored SQLite 3.37.2 headers (see
# crates/sqlite_dbtindb/sqlite-headers/README.md). The loadable build runs
# bindgen against sqlite3ext.h and links no SQLite library; the LIB_DIR entry
# only makes libsqlite3-sys take the include directory from the environment.
[env]
SQLITE3_INCLUDE_DIR = { value = "crates/sqlite_dbtindb/sqlite-headers", relative = true }
SQLITE3_LIB_DIR = { value = "crates/sqlite_dbtindb/sqlite-headers", relative = true }
